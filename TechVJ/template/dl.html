<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="https://i.ibb.co/qJyZWCv/20230629-081948-0000.png" type="image/x-icon">
    <meta property="og:image" content="https://i.ibb.co/qJyZWCv/20230629-081948-0000.png" itemprop="thumbnailUrl">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{file_name}} | SS ANIME</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"></script>    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    
    <script>
        var userId = "{{user_id}}";
        var hasSpent30Seconds = false;
        var clickCounted = false;

        function setSpentTimeFlag() {
            hasSpent30Seconds = true;
        }

        setTimeout(setSpentTimeFlag, 30000);

        document.addEventListener("click", function(event) {
            if (hasSpent30Seconds && !clickCounted) {
                clickCounted = true;
                fetch('/click-counter', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_id: userId })
                })
                .then(function(response) { return response.json(); })
                .catch(function(error) { console.error('Error:', error); });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Delius">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Adsterra Popunder Ad Script -->
    <script type='text/javascript' src='//pl31449494.profitableratecpmnetwork.com/f6/40/8b/f6408b230f32b1b9f922700a9db280bc.js'></script>
</head>

<body class="bg-black text-light">
    <header>
        <!-- Navbar -->
        <nav class="navbar bg-dark p-lg-4 p-2">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand text-light fw-bold" href="{{link}}">
                    <span class="bg-clip-text sm:text-[25px] text-[22px] text-transparent bg-gradient-to-r from-pink-500 to-violet-500">
                        SS ANIME
                    </span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <!-- File Name Display -->
        <div class="text-center my-3">
            <h5 id="myDiv" class="fw-bold text-wrap wow animate__animated animate__fadeInRight">
                {{file_name}}
            </h5>
        </div>

        <!-- Online Video Player -->
        <div class="row justify-content-center my-3">
            <div class="col-lg-10 border border-danger p-2 rounded">
                <video id="player" class="player" playsinline controls preload="auto">
                    {% if file_url %}
                    <source src="{{file_url}}" type="video/mp4">
                    {% endif %}
                    {% if file_url_two %}
                    <source src="{{file_url_two}}" type="video/mp4">
                    {% endif %}
                    {% if file_url_three %}
                    <source src="{{file_url_three}}" type="video/mp4">
                    {% endif %}
                    Your browser does not support HTML5 video.
                </video>		    
            </div>
        </div>

        <!-- Buttons Section -->
        <div class="d-flex gap-3 flex-wrap justify-content-center my-4">
            {% if file_url %}
            <a href="{{file_url}}" download class="btn btn-success font-bold px-4 py-2 rounded-3">
                📥 Direct Download
            </a>
            {% endif %}

            <a href="{{link}}" target="_blank" class="btn btn-primary font-bold px-4 py-2 rounded-3">
                Join Telegram Channel
            </a>
            
            <a href="https://omg10.com/4/11087331" target="_blank" class="btn btn-warning font-bold px-4 py-2 rounded-3">
                🚀 Fast Server / Bonus Ads
            </a>
        </div>

        <!-- Warning / Codec Notice -->
        <div class="row justify-content-center my-3">
            <div class="col-lg-8 p-2 text-center bg-danger rounded-4 text-sm font-bold">
                Video Not Playing ? Possibly Browser Doesn't Support Video Codec. Open Link In Chrome or MX Player.
            </div>
        </div>
    </main>

    <footer class="bg-dark text-center text-xs p-3 text-light mt-auto">
        © <script type="text/JavaScript">
            var theDate=new Date(); 
            document.write(theDate.getFullYear()); 
        </script> Copyright :
        <a class="bg-clip-text text-[16px] text-transparent bg-gradient-to-r from-pink-500 to-violet-500 font-bold px-1" href="{{link}}">SS ANIME</a>             
        All Rights Reserved
    </footer>

    <script src="js/wow.min.js"></script>
    <script>
        new WOW().init();
        var div = document.getElementById('myDiv');
        if(div && div.textContent.length > 60){
            div.textContent = div.textContent.slice(0, 60) + "...";
        }
    </script>
    
    <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var controls = [
                'play-large', 'rewind', 'play', 'fast-forward', 
                'progress', 'current-time', 'duration', 'mute', 
                'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
            ];
            Plyr.setup('.player', { controls: controls });
        });
    </script>

    <!-- Adsterra Social Bar Ad Script -->
    <script type='text/javascript' src='//pl31449495.profitableratecpmnetwork.com/cc/eb/45/cceb451ae3f522dbdc5df727ae035cbb.js'></script>
</body>
</html>
